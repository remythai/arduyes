# Mosquitto for the cold-chain demo.
#   mosquitto -c mosquitto.conf -v
#
# Open on the LAN so the node and the team's laptops can all reach it.
# No authentication: this is a classroom demo on a hotspot, not a deployment.
# Adding users is one line (password_file) and belongs in the security section
# of the report rather than here.

listener 1883 0.0.0.0
allow_anonymous true

# Keep the retained messages (status, shipment) across a broker restart, and
# keep QoS 1 messages queued for a subscriber that is briefly away.
persistence true
persistence_location ./
autosave_interval 30

# A session must outlive a short disconnection, otherwise a dashboard that
# reconnects would silently miss readings.
max_queued_messages 10000
